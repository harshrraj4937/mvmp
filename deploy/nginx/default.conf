# Reverse proxy in front of gillu-web.

# Keep a well-formed client correlation id; otherwise use nginx's own.
map $http_x_request_id $gillu_request_id {
    default                     $request_id;
    "~^[A-Za-z0-9_-]{8,128}$"   $http_x_request_id;
}

log_format gillu_json escape=json
    '{"time":"$time_iso8601","service":"nginx","request_id":"$gillu_request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"user_agent":"$http_user_agent"}';

upstream gillu_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout gillu_json;
    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://gillu_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) client-supplied forwarding headers:
        # better-auth rate-limits per X-Forwarded-For IP, so a spoofable
        # value would let clients bypass the limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $gillu_request_id;
        proxy_read_timeout 60s;
    }
}
